name: Build unsigned iOS IPA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Prepare offline app
        timeout-minutes: 5
        run: |
          npm ci
          npm run build
          node scripts/prepare-ios.mjs
          brew install xcodegen
          swift scripts/make-ios-icon.swift
          cd ios
          xcodegen generate
      - name: Build unsigned device app
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild -project ios/Isolation.xcodeproj -scheme Isolation -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build > device-build.log 2>&1 || { tail -100 device-build.log; exit 1; }
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Isolation.app build/package/Payload/
          cd build/package
          zip -qr ../../Isolation-0.2.0-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Isolation-0.2.0-unsigned-ipa
          path: Isolation-0.2.0-unsigned.ipa
          if-no-files-found: error
      - name: Native launch and persistence smoke check
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild -project ios/Isolation.xcodeproj -scheme Isolation -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build > simulator-build.log 2>&1 || { tail -80 simulator-build.log; exit 1; }
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS-26" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/simulator/Build/Products/Debug-iphonesimulator/Isolation.app
          xcrun simctl launch "$DEVICE_ID" com.brokenbydefault.isolation --smoke-test
          APP_DATA=$(xcrun simctl get_app_container "$DEVICE_ID" com.brokenbydefault.isolation data)
          for attempt in $(seq 1 45); do
            if [ -f "$APP_DATA/Documents/native-smoke.json" ]; then break; fi
            sleep 1
          done
          cp "$APP_DATA/Documents/native-smoke.json" native-smoke.json
          cat native-smoke.json
          python3 -c 'import json; r=json.load(open("native-smoke.json")); assert r["status"]=="passed",r; assert r["canvasWidth"]==r["viewportWidth"],r'
          xcrun simctl io "$DEVICE_ID" screenshot native-smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-evidence
          path: |
            device-build.log
            simulator-build.log
            native-smoke.json
            native-smoke.png
